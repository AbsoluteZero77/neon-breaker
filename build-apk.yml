name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: mkdir -p www && cp index.html www/
      - run: npx cap add android && npx cap sync android
      - name: Portrait and fullscreen
        run: |
          sed -i 's/android:configChanges=/android:screenOrientation="portrait" android:configChanges=/' android/app/src/main/AndroidManifest.xml
          sed -i 's|<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">|&\n        <item name="android:windowFullscreen">true</item>|' android/app/src/main/res/values/styles.xml
          grep -n "screenOrientation" android/app/src/main/AndroidManifest.xml || echo "orientation patch not applied"
          grep -n "windowFullscreen" android/app/src/main/res/values/styles.xml || echo "fullscreen patch not applied"
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk neon-breaker.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest neon-breaker.apk --title "Neon Breaker" --notes "Debug build" --target ${{ github.sha }}
