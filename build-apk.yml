name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Copy game into web folder
        run: |
          mkdir -p www
          cp index.html www/

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Lock to landscape
        run: sed -i 's/android:configChanges=/android:screenOrientation="landscape" android:configChanges=/' android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: neon-breaker-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
